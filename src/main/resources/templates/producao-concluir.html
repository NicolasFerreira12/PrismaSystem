<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Concluir Ordem de Produção - PrismaSys</title>
    <link rel="stylesheet" th:href="@{/css/prismasys.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('producao')}"></div>
    <main class="main">
        <div class="page-header"><h1 th:text="${'Concluir ordem #' + ordem.id}">Concluir ordem</h1></div>

        <div class="card" style="border-color: var(--danger); background:#FBEDE8; margin-bottom:16px; max-width:480px;" th:if="${erro}">
            <span th:text="${erro}" style="color:var(--danger); font-weight:600;"></span>
        </div>

        <div class="card" style="max-width:480px;">
            <p><strong th:text="${ordem.produto.nome}">Produto</strong></p>
            <p style="margin-bottom:16px;"
               th:text="${'Planejado: ' + #numbers.formatDecimal(ordem.quantidadePlanejada, 1, 'POINT', 3, 'COMMA') + ' ' + ordem.produto.unidadeMedida}">Planejado</p>

            <form th:action="@{'/producao/' + ${ordem.id} + '/concluir'}" method="post">
                <div class="form-field">
                    <label th:text="${'Quantidade produzida (' + ordem.produto.unidadeMedida + ')'}">Quantidade produzida</label>
                    <input type="text" name="quantidadeProduzida" required
                           th:value="${quantidadeSel != null} ? ${quantidadeSel} : ${#numbers.formatDecimal(ordem.quantidadePlanejada, 1, 'POINT', 3, 'COMMA')}"/>
                </div>
                <p style="margin-bottom:16px; font-size:13px;">Ao confirmar, a quantidade informada entra no estoque como produto acabado.</p>
                <button type="submit" class="btn btn-primary">Confirmar conclusão</button>
            </form>
        </div>
        <p style="margin-top:16px;"><a href="/producao">← Voltar</a></p>
    </main>
</div>
</body>
</html>
