<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Alterar Conta - PrismaSys</title>
  <link rel="stylesheet" th:href="@{/css/prismasys.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('financeiro')}"></div>
  <main class="main">
    <div class="page-header"><h1>Alterar conta</h1></div>
    <div class="card">
      <form th:action="@{/financeiro/contas/update}" th:object="${conta}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="form-field">
          <label>Descrição</label>
          <input type="text" th:field="*{descricao}"/>
        </div>
        <div class="form-field">
          <label>Tipo</label>
          <select th:field="*{tipo}" style="padding:9px 12px; border:1px solid var(--border); border-radius:4px; font-family:var(--font-body); font-size:14px;">
            <option value="PAGAR">A pagar</option>
            <option value="RECEBER">A receber</option>
          </select>
        </div>
        <div class="form-field">
          <label>Valor</label>
          <input type="text" th:field="*{valor}"/>
        </div>
        <div class="form-field">
          <label>Data de vencimento</label>
          <input type="date" th:field="*{dataVencimento}"/>
        </div>
        <button type="submit" class="btn btn-primary">Salvar alterações</button>
      </form>
    </div>
    <p style="margin-top:16px;"><a href="/financeiro/contas">← Voltar</a></p>
  </main>
</div>
</body>
</html>
