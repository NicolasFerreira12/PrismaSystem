<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova Ordem de Produção - PrismaSys</title>
    <link rel="stylesheet" th:href="@{/css/prismasys.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('producao')}"></div>
    <main class="main">
        <div class="page-header"><h1>Nova ordem de produção</h1></div>

        <div class="card" style="border-color: var(--danger); background:#FBEDE8; margin-bottom:16px; max-width:480px;" th:if="${erro}">
            <span th:text="${erro}" style="color:var(--danger); font-weight:600;"></span>
        </div>

        <div class="card" style="max-width:480px;">
            <form th:action="@{/producao/nova}" method="post">
                <div class="form-field">
                    <label>Produto</label>
                    <select name="produtoId" required style="padding:9px 12px; border:1px solid var(--border); border-radius:4px; font-family:var(--font-body); font-size:14px;">
                        <option value="">Selecione...</option>
                        <option th:each="p : ${produtos}" th:value="${p.id}"
                                th:selected="${produtoIdSel != null and produtoIdSel == p.id}"
                                th:text="${p.nome + ' (' + p.unidadeMedida + ')'}"></option>
                    </select>
                </div>
                <div class="form-field">
                    <label>Quantidade a produzir</label>
                    <input type="text" name="quantidade" required th:value="${quantidadeSel}"/>
                </div>
                <div class="form-field">
                    <label>Data prevista (opcional)</label>
                    <input type="date" name="dataPrevista" th:value="${dataPrevistaSel}"/>
                </div>
                <div class="form-field">
                    <label>Observação (opcional)</label>
                    <input type="text" name="observacao" maxlength="255" th:value="${observacaoSel}"/>
                </div>
                <button type="submit" class="btn btn-primary">Criar ordem</button>
            </form>
        </div>
        <p style="margin-top:16px;"><a href="/producao">← Voltar</a></p>
    </main>
</div>
</body>
</html>
