<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Alterar Fornecedor - PrismaSys</title>
  <link rel="stylesheet" th:href="@{/css/prismasys.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('fornecedores')}"></div>
  <main class="main">
    <div class="page-header"><h1>Alterar fornecedor</h1></div>
    <div class="card">
      <form th:action="@{/fornecedores/update}" th:object="${fornecedor}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="form-field"><label>Nome</label><input type="text" th:field="*{nome}"/></div>
        <div class="form-field"><label>CNPJ</label><input type="text" th:field="*{cnpj}" readonly/></div>
        <div class="form-field"><label>Telefone</label><input type="text" th:field="*{telefone}"/></div>
        <div class="form-field"><label>E-mail</label><input type="text" th:field="*{email}"/></div>
        <div class="form-field"><label>Endereço</label><input type="text" th:field="*{endereco}"/></div>
        <button type="submit" class="btn btn-primary">Salvar alterações</button>
      </form>
    </div>
    <p style="margin-top:16px;"><a href="/fornecedores">← Voltar</a></p>
  </main>
</div>
</body>
</html>
