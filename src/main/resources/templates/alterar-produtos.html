<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Alterar Produto - PrismaSys</title>
  <link rel="stylesheet" th:href="@{/css/prismasys.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('produtos')}"></div>
  <main class="main">
    <div class="page-header"><h1>Alterar produto</h1></div>
    <div class="card">
      <form th:action="@{/produtos/update}" th:object="${produto}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="form-field"><label>Nome</label><input type="text" th:field="*{nome}"/></div>
        <div class="form-field"><label>Unidade de medida</label><input type="text" th:field="*{unidadeMedida}"/></div>
        <div class="form-field"><label>Preço unitário</label><input type="text" th:field="*{precoUnitario}"/></div>
        <button type="submit" class="btn btn-primary">Salvar alterações</button>
      </form>
    </div>
    <p style="margin-top:16px;"><a href="/produtos">← Voltar</a></p>
  </main>
</div>
</body>
</html>
