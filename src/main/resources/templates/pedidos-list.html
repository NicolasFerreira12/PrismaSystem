<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lista de Pedidos - PrismaSys</title>
  <link rel="stylesheet" th:href="@{/css/prismasys.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('pedidos')}"></div>
  <main class="main">
    <div class="page-header"><h1>Pedidos</h1></div>
    <table class="data-table">
      <tr>
        <th>ID</th><th>Cliente</th><th>Transportadora</th><th>Data</th><th>Total</th><th>Status</th><th></th>
      </tr>
      <tr th:each="pedido: ${pedidos}">
        <td class="mono" th:text="${pedido.id}">ID</td>
        <td th:text="${pedido.cliente.nome}">Cliente</td>
        <td th:text="${pedido.transportadora.nome}">Transportadora</td>
        <td th:text="${#dates.format(pedido.dataPedido,'dd/MM/yyyy HH:mm')}">Data</td>
        <td th:text="${#numbers.formatCurrency(pedido.valorTotal)}">Total</td>
        <td th:text="${pedido.status}">Status</td>
        <td><a th:href="@{'/pedidos/' + ${pedido.id}}">Ver detalhes</a></td>
      </tr>
    </table>
    <p style="margin-top:16px;"><a href="/pedidos">← Voltar</a></p>
  </main>
</div>
</body>
</html>
