<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lista de Clientes - PrismaSys</title>
  <link rel="stylesheet" th:href="@{/css/prismasys.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('clientes')}"></div>
  <main class="main">
    <div class="page-header"><h1>Clientes cadastrados</h1></div>
    <table class="data-table">
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>CPF/CNPJ</th>
        <th>Telefone</th>
        <th>E-mail</th>
      </tr>
      <tr th:each="cliente: ${clientes}">
        <td class="mono" th:text="${cliente.id}">ID</td>
        <td th:text="${cliente.nome}">Nome</td>
        <td class="mono" th:text="${cliente.cpfCnpj}">CPF/CNPJ</td>
        <td th:text="${cliente.telefone}">Telefone</td>
        <td th:text="${cliente.email}">E-mail</td>
      </tr>
    </table>
    <p style="margin-top:16px;"><a href="/clientes">← Voltar</a></p>
  </main>
</div>
</body>
</html>
