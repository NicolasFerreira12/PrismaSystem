<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Excluir Funcionário - PrismaSys</title>
    <link rel="stylesheet" th:href="@{/css/prismasys.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('funcionarios')}"></div>
    <main class="main">
        <div class="page-header"><h1>Excluir funcionário</h1></div>
        <div class="card">
            <form action="/funcionarios/delete" method="get">
                <div class="form-field">
                    <label>RE</label>
                    <input type="text" name="re"/>
                </div>
                <button type="submit" class="btn btn-primary" style="background:var(--danger);">Excluir</button>
            </form>
        </div>
        <p style="margin-top:16px;"><a href="/funcionarios">← Voltar</a></p>
    </main>
</div>
</body>
</html>
