<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Buscar Cliente - PrismaSys</title>
  <link rel="stylesheet" th:href="@{/css/prismasys.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('clientes')}"></div>
  <main class="main">
    <div class="page-header"><h1>Buscar / alterar cliente</h1></div>
    <div class="card">
      <form action="/clientes/search" method="get">
        <div class="form-field">
          <label>CPF/CNPJ</label>
          <input type="text" name="cpfCnpj"/>
        </div>
        <button type="submit" class="btn btn-primary">Buscar</button>
      </form>
    </div>
    <p style="margin-top:16px;"><a href="/clientes">← Voltar</a></p>
  </main>
</div>
</body>
</html>
