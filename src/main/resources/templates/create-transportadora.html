<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Transportadora - PrismaSys</title>
  <link rel="stylesheet" th:href="@{/css/prismasys.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('transportadoras')}"></div>
  <main class="main">
    <div class="page-header"><h1>Cadastrar transportadora</h1></div>
    <div class="card" style="border-color: var(--danger); background:#FBEDE8; margin-bottom:16px;" th:if="${erro}">
      <span th:text="${erro}" style="color:var(--danger); font-weight:600;"></span>
    </div>
    <div class="card">
      <form th:action="@{/transportadoras}" th:object="${transportadora}" method="post">
        <div class="form-field"><label>Nome</label><input type="text" th:field="*{nome}"/></div>
        <div class="form-field"><label>CNPJ</label><input type="text" th:field="*{cnpj}"/></div>
        <div class="form-field"><label>Telefone</label><input type="text" th:field="*{telefone}"/></div>
        <div class="form-field"><label>E-mail</label><input type="text" th:field="*{email}"/></div>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </form>
    </div>
    <p style="margin-top:16px;"><a href="/transportadoras">← Voltar</a></p>
  </main>
</div>
</body>
</html>
