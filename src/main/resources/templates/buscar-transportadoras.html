<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Buscar Transportadora - PrismaSys</title>
  <link rel="stylesheet" th:href="@{/css/prismasys.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('transportadoras')}"></div>
  <main class="main">
    <div class="page-header"><h1>Buscar / alterar transportadora</h1></div>
    <div class="card">
      <form action="/transportadoras/search" method="get">
        <div class="form-field"><label>CNPJ</label><input type="text" name="cnpj"/></div>
        <button type="submit" class="btn btn-primary">Buscar</button>
      </form>
    </div>
    <p style="margin-top:16px;"><a href="/transportadoras">← Voltar</a></p>
  </main>
</div>
</body>
</html>
