<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Histórico de Cliente - PrismaSys</title>
  <link rel="stylesheet" th:href="@{/css/prismasys.css}">
</head>
<body>
<div class="app-shell">
  <div th:replace="~{fragments/sidebar :: sidebar('financeiro')}"></div>
  <main class="main">
    <div class="page-header"><h1>Histórico de Cliente</h1></div>

    <form method="get" style="display:flex; gap:12px; align-items:flex-end; margin-bottom:20px;">
      <div class="form-field" style="margin-bottom:0;">
        <label>Cliente</label>
        <select name="clienteId" required style="padding:9px 12px; border:1px solid var(--border); border-radius:4px; font-family:var(--font-body); font-size:14px;">
          <option value="">Selecione...</option>
          <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nome}"
                  th:selected="${clienteId != null and clienteId == cliente.id}"></option>
        </select>
      </div>
      <div class="form-field" style="margin-bottom:0;">
        <label>Mês (Relatório Mensal)</label>
        <input type="month" name="mes" th:value="${mes}"/>
      </div>
      <button type="submit" class="btn btn-primary">Consultar</button>
      <a class="btn btn-outline" th:href="@{/financeiro/relatorios/cliente}">Limpar</a>
    </form>

    <div th:if="${pedidos != null}">
      <table class="data-table">
        <tr>
          <th>Pedido</th><th>Data</th><th>Status</th><th>Total</th>
        </tr>
        <tr th:each="pedido : ${pedidos}">
          <td class="mono" th:text="${pedido.id}">ID</td>
          <td th:text="${#dates.format(pedido.dataPedido,'dd/MM/yyyy HH:mm')}">Data</td>
          <td th:text="${pedido.status}">Status</td>
          <td th:text="${#numbers.formatCurrency(pedido.valorTotal)}">Total</td>
        </tr>
      </table>
      <p style="margin-top:16px; font-weight:600;">
        <span th:text="${#lists.size(pedidos)}">0</span> pedido(s) —
        Total em pedidos: <span th:text="${#numbers.formatCurrency(total)}">R$ 0,00</span> —
        Total pago: <span th:text="${#numbers.formatCurrency(totalPago)}">R$ 0,00</span>
      </p>
    </div>
    <p style="margin-top:16px;"><a href="/financeiro/relatorios">← Voltar</a></p>
  </main>
</div>
</body>
</html>
