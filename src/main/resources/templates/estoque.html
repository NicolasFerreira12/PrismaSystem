<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estoque - PrismaSys</title>
    <link rel="stylesheet" th:href="@{/css/prismasys.css}">
</head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('estoque')}"></div>
    <main class="main">
        <div class="page-header"><h1>Estoque</h1></div>

        <div class="card" style="border-color: var(--danger); background:#FBEDE8; margin-bottom:16px;" th:if="${not #lists.isEmpty(alertas)}">
            <strong style="color:var(--danger);">Produtos no estoque mínimo ou abaixo dele:</strong>
            <ul style="margin-top:8px;">
                <li th:each="p : ${alertas}"
                    th:text="${p.nome + ' — saldo ' + #numbers.formatDecimal(p.estoqueAtual, 1, 'POINT', 3, 'COMMA') + ' ' + p.unidadeMedida + ' (mínimo ' + #numbers.formatDecimal(p.estoqueMinimo, 1, 'POINT', 3, 'COMMA') + ')'}"></li>
            </ul>
        </div>

        <div class="card" style="display:flex; gap:12px; flex-wrap:wrap;">
            <a class="btn btn-accent" href="/estoque/entrada">+ Entrada</a>
            <a class="btn btn-outline" href="/estoque/saida">Saída</a>
            <a class="btn btn-outline" href="/estoque/ajuste">Ajuste de inventário</a>
            <a class="btn btn-outline" href="/estoque/saldos">Saldos</a>
            <a class="btn btn-outline" href="/estoque/historico">Histórico</a>
        </div>
    </main>
</div>
</body>
</html>
